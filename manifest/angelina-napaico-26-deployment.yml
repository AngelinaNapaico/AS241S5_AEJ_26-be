# kubectl apply -f angelina-napaico-26-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: angelina-napaico-26-deployment
  namespace: angelina-napaico-26-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: angelina-napaico-26-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: angelina-napaico-26-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: angelina-napaico-26-container
        image: valencia123/as241-be:latest   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
        envFrom:
        - secretRef:
            name: angelina-napaico-26-secret  # Esto cargará todos los valores como variables de entorno