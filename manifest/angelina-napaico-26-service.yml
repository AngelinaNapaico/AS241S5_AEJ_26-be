# kubectl apply -f angelina-napaico-26-service.yml
apiVersion: v1
kind: Service
metadata:
  name: angelina-napaico-26-service
  namespace: angelina-napaico-26-namespace
spec:
  type: NodePort      #30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001       # Puerto que el Service expondrá
    targetPort: 8085  # Puerto en el contenedor donde tu aplicación escucha
    nodePort: 30001   # Puerto asignado en el nodo, opcional
  selector:
    app: angelina-napaico-26-deployment  # Debe coincidir con las etiquetas del Deployment